[project]
name = "stewardai"
version = "0.1.0"
description = "Steward: a gatekeeper between the AI agents you run and the models, tools and other agents they reach"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "apps/gateway",
    "packages/core",
    "packages/fixtures",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["steward_core", "steward_gateway", "steward_fixtures"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/gateway/src", "packages/core/src", "packages/fixtures/src", "spikes"]

# tavily-python ships no type information.
[[tool.mypy.overrides]]
module = ["tavily", "tavily.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["apps", "packages", "evals"]
pythonpath = ["apps/gateway/tests"]
addopts = "--import-mode=importlib"
