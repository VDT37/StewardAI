# Provider profile for the personal agent (OpenClaw in the personal-agent sandbox).
# Inside the sandbox STEWARD_PASS_PERSONAL holds a placeholder. The OpenShell proxy swaps in
# the real pass only on requests to the endpoints below, from the binaries below.
#   openshell profile lint -f agents/openshell/profile-steward-personal.yaml
#   openshell profile import -f agents/openshell/profile-steward-personal.yaml
id: steward-personal
display_name: Steward (personal agent)
description: Pass for the personal agent, valid only at Steward on the host.
category: inference
inference_capable: true
credentials:
  - name: pass
    description: Steward pass for the personal agent
    env_vars: [STEWARD_PASS_PERSONAL]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [pass]
endpoints:
  # Model door
  - host: host.openshell.internal
    port: 8000
    path: /v1/**
    protocol: rest
    access: full # MCP uses POST, GET and DELETE; read-write lacks DELETE
    enforcement: enforce
  # Tool door, personal side only
  - host: host.openshell.internal
    port: 8000
    path: /tools/personal/**
    protocol: rest
    access: full
    enforcement: enforce
# OpenClaw runs on Node from the node:24 image. If the fallback (a second Hermes sandbox)
# is taken, swap this for the Hermes globs in profile-steward-work.yaml and re-import.
binaries:
  - /usr/local/bin/node
