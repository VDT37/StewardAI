# Provider profile for the work agent (Hermes in the work-agent sandbox).
# Inside the sandbox STEWARD_PASS_WORK holds a placeholder. The OpenShell proxy swaps in the
# real pass only on requests to the endpoints below, from the binaries below.
#   openshell profile lint -f agents/openshell/profile-steward-work.yaml
#   openshell profile import -f agents/openshell/profile-steward-work.yaml
id: steward-work
display_name: Steward (work agent)
description: Pass for the work agent, valid only at Steward on the host.
category: inference
inference_capable: true
credentials:
  - name: pass
    description: Steward pass for the work agent
    env_vars: [STEWARD_PASS_WORK]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [pass]
endpoints:
  # Model door
  - host: host.openshell.internal
    port: 8000
    path: /v1/**
    protocol: rest
    access: full # MCP uses POST, GET and DELETE; read-write lacks DELETE
    enforcement: enforce
  # Tool door, work side only
  - host: host.openshell.internal
    port: 8000
    path: /tools/work/**
    protocol: rest
    access: full
    enforcement: enforce
# Hermes installs under ~/.hermes and its uv-managed Python under ~/.local or ~/.hermes.
# The image build prints the launcher's interpreter; narrow these globs once confirmed.
binaries:
  - /home/ubuntu/.hermes/**
  - /home/ubuntu/.local/**
