# Base sandbox policy for both agents (work-agent and personal-agent).
# Default-deny network: this file adds no network rule. The only allowed destination comes
# from the provider profile attached at create time (Steward on host.openshell.internal:8000).
version: 1
filesystem_policy:
  # Defaults to false once filesystem_policy is present. True makes the image's WORKDIR
  # (the agent's home, where its install and config live) writable.
  include_workdir: true
  read_only: [/usr, /lib, /bin, /etc, /proc, /dev/urandom, /var/log]
  read_write: [/tmp, /dev/null]
landlock:
  # Refuse to start if Landlock cannot be enforced (best_effort would run unenforced).
  compatibility: hard_requirement
network_policies: {}
