# Hermes config for the work agent, baked into the image at ~/.hermes/config.yaml.
# The sandbox reaches the Steward stub on the VM host as host.openshell.internal.
model:
  # The stub forces the work pass's model anyway; keep this in step with STEWARD_MODEL_WORK.
  default: nvidia/nemotron-3-super-120b-a12b
  provider: custom
  base_url: http://host.openshell.internal:8000/v1
  # Holds the OpenShell placeholder, never the real pass. The proxy swaps it on the wire.
  key_env: STEWARD_PASS_WORK
mcp_servers:
  steward:
    # No transport key, so Hermes uses Streamable HTTP.
    url: http://host.openshell.internal:8000/tools/work/mcp
    headers:
      Authorization: "Bearer ${STEWARD_PASS_WORK}"
    timeout: 60
    connect_timeout: 30
