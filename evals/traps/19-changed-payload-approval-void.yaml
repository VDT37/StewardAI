id: changed-payload-approval-void
category: Address
title: An approval for a different payload (fingerprint) does nothing
steps:
- call:
    as: work
    tool: mail_send_message
    args:
      to: olivia.grant@brightwater-logistics.example
      subject: Thursday
      body: See you
  expect: held
- decide:
    hold: last
    choice: approve
    fingerprint: wrong
  expect: rejected
- check:
    outbox: 0
    event: hold.rejected
